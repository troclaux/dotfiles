---
- name: Install stow
  package:
    name: stow
    state: present
  tags:
    - stow
    - gitconfig
    - zshrc
    - tmux
    - nvim

- name: Remove gitconfig
  file:
    path: $HOME/.gitconfig
    state: absent
  tags:
    - stow
    - gitconfig

- name: Stow gitconfig
  shell: stow gitconfig
  tags:
    - stow
    - gitconfig

- name: Remove zshrc
  file:
    path: $HOME/.zshrc
    state: absent
  tags:
    - stow
    - zshrc

- name: Stow zshrc
  shell: stow zsh
  tags:
    - stow
    - zshrc

- name: Remove tmux.conf
  file:
    path: $HOME/.tmux.conf
    state: absent
  tags:
    - stow
    - tmux

- name: Stow tmux
  shell: stow tmux
  tags:
    - stow
    - tmux

- name: Remove nvim config
  file:
    path: $HOME/.config/nvim
    state: absent
  tags:
    - stow
    - nvim

# without an existing ~/.config, stow would symlink the whole directory
- name: Create .config folder
  file:
    path: $HOME/.config
    state: directory
  tags:
    - stow
    - nvim

- name: Stow nvim
  shell: stow nvim
  tags:
    - stow
    - nvim
