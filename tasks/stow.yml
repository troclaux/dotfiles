---
- name: Install stow
  package:
    name: stow
    state: present
  tags:
    - stow
    - gitconfig
    - zshrc
    - tmux

- name: Remove gitconfig
  file:
    path: $HOME/.gitconfig
    state: absent
  tags:
    - stow
    - gitconfig

- name: Stow gitconfig
  shell: stow gitconfig
  tags:
    - stow
    - gitconfig

- name: Remove zshrc
  file:
    path: $HOME/.zshrc
    state: absent
  tags:
    - stow
    - zshrc

- name: Stow zshrc
  shell: stow zsh
  tags:
    - stow
    - zshrc

- name: Remove tmux.conf
  file:
    path: $HOME/.tmux.conf
    state: absent
  tags:
    - stow
    - tmux

- name: Stow tmux
  shell: stow tmux
  tags:
    - stow
    - tmux

# without an existing ~/.config, stow would symlink the whole directory
- name: Create .config folder
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory
  tags:
    - stow
    - gtk

- name: Remove gtk.css
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/gtk-3.0/gtk.css"
    state: absent
  tags:
    - stow
    - gtk

# no folding: GTK writes other files to this folder, which must stay out of the repo
- name: Stow gtk
  become: false
  shell: stow --no-folding gtk
  args:
    chdir: "{{ lookup('env', 'HOME') }}/dotfiles"
  tags:
    - stow
    - gtk
