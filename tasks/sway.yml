---
- name: Install packages for sway
  package:
    name:
      - sway
      - light
      - swaylock
      - swayidle
      - waybar
      - wofi
      - fuzzel
      - wdisplays
      - wlr-randr
      - pulseaudio-utils
      - pavucontrol
      - playerctl
      - grimshot
      - copyq
      - dunst
      - wtype
      - blueman
    state: present
  tags:
    - sway

- name: Install font awesome and network management tool for Debian-based distro
  apt:
    name:
      - network-manager-gnome
      - fonts-font-awesome
  tags:
    - sway
  when: ansible_pkg_mgr == 'apt'

- name: Install font awesome and network management tool for Fedora linux
  dnf:
    name:
      - network-manager-applet
      - fontawesome-fonts
      - wshowkeys
  tags:
    - sway
  when: ansible_pkg_mgr == 'dnf'

- name: Create .config folder for sway configs
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory
  tags: sway

- name: Remove existing sway configs
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/{{ item }}"
    state: absent
  loop: [sway, waybar, fuzzel, wofi, kanshi]
  tags: sway

- name: Stow sway configs
  become: false
  shell: stow sway waybar fuzzel wofi kanshi
  args:
    chdir: "{{ lookup('env', 'HOME') }}/dotfiles"
  tags: sway
