---
- name: Install kitty package
  package:
    name: kitty
    state: present
  tags:
    - kitty

- name: Create .config folder for kitty
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory
  tags:
    - kitty
    - stow_kitty_conf

- name: Remove existing kitty config
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/kitty"
    state: absent
  tags:
    - kitty
    - stow_kitty_conf

- name: Stow kitty
  become: false
  shell: stow kitty
  args:
    chdir: "{{ lookup('env', 'HOME') }}/dotfiles"
  tags:
    - kitty
    - stow_kitty_conf
